<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alarma</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --txt:#e2e8f0; --acc:#38bdf8; --danger:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:var(--bg); color:var(--txt); font-family:system-ui,sans-serif; }
  main { background:var(--card); padding:2rem; border-radius:1rem; width:min(92vw,380px);
         box-shadow:0 10px 30px #0006; }
  h1 { margin:0 0 .25rem; font-size:1.3rem; }
  #reloj { font-size:2.6rem; font-variant-numeric:tabular-nums; margin:.25rem 0 1.25rem; }
  label { display:block; font-size:.85rem; margin:.9rem 0 .3rem; opacity:.85; }
  input, select { width:100%; padding:.6rem; border-radius:.5rem; border:1px solid #475569;
                  background:#0f172a; color:var(--txt); font-size:1rem; }
  .fila { display:flex; gap:.5rem; margin-top:1.2rem; }
  button { flex:1; padding:.7rem; border:0; border-radius:.5rem; font-size:1rem;
           font-weight:600; cursor:pointer; background:var(--acc); color:#0f172a; }
  button.sec { background:#334155; color:var(--txt); }
  button.stop { background:var(--danger); color:#fff; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  #estado { margin-top:1.1rem; min-height:1.5em; font-size:.95rem; }
  .sonando { animation:pulso 1s infinite; }
  @keyframes pulso { 50% { opacity:.4; } }
</style>
</head>
<body>
<main>
  <h1>⏰ Alarma</h1>
  <div id="reloj">--:--:--</div>

  <label for="hora">Hora de la alarma</label>
  <input type="time" id="hora" step="1">

  <label for="sonido">Sonido</label>
  <select id="sonido">
    <option value="beep">Pitido digital</option>
    <option value="sirena">Sirena</option>
    <option value="campana">Campana</option>
    <option value="alterno">Dos tonos alternos</option>
  </select>

  <label for="duracion">Duración (segundos)</label>
  <input type="number" id="duracion" min="1" max="600" value="30">

  <label for="volumen">Volumen</label>
  <input type="range" id="volumen" min="0" max="1" step="0.05" value="0.5">

  <div class="fila">
    <button id="activar">Activar</button>
    <button id="probar" class="sec">Probar</button>
  </div>
  <div class="fila">
    <button id="detener" class="stop" disabled>Detener / cancelar</button>
  </div>
  <div id="estado" aria-live="polite"></div>
</main>

<script>
const $ = id => document.getElementById(id);
let ctx, master, objetivo = null, finSonido = 0, timerCiclo = null, vigilante = null;
const activos = new Set();

/* ---------- Síntesis de sonidos ---------- */
function registrar(o) {
  activos.add(o);
  o.onended = () => activos.delete(o);
}

function tono(tipo, freq, t, dur, vol) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = tipo; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(master);
  registrar(o);
  o.start(t); o.stop(t + dur + 0.05);
}

const sonidos = {
  beep:    { ciclo: 0.5, tocar: t => tono('square', 880, t, 0.18, 0.4) },
  sirena:  { ciclo: 1.0, tocar: t => {
              const o = ctx.createOscillator(), g = ctx.createGain();
              o.type = 'sawtooth';
              o.frequency.setValueAtTime(600, t);
              o.frequency.linearRampToValueAtTime(1200, t + 0.5);
              o.frequency.linearRampToValueAtTime(600, t + 1.0);
              g.gain.value = 0.3;
              o.connect(g).connect(master);
              registrar(o);
              o.start(t); o.stop(t + 1.0);
            } },
  campana: { ciclo: 1.8, tocar: t => {
              tono('sine', 523, t, 1.6, 0.5);
              tono('sine', 784, t, 1.2, 0.25);
              tono('sine', 1046, t, 0.8, 0.15);
            } },
  alterno: { ciclo: 0.8, tocar: t => {
              tono('triangle', 988, t, 0.3, 0.5);
              tono('triangle', 784, t + 0.4, 0.3, 0.5);
            } }
};

function iniciarAudio() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.connect(ctx.destination);
  }
  if (ctx.state === 'suspended') ctx.resume();
  master.gain.cancelScheduledValues(ctx.currentTime);
  master.gain.setValueAtTime(+$('volumen').value, ctx.currentTime);
}

function sonar(segundos) {
  pararSonido();
  iniciarAudio();
  const s = sonidos[$('sonido').value];
  finSonido = Date.now() + segundos * 1000;
  const lanzar = () => {
    if (Date.now() >= finSonido) return terminar();
    s.tocar(ctx.currentTime + 0.02);
  };
  lanzar();
  timerCiclo = setInterval(lanzar, s.ciclo * 1000);
  $('estado').classList.add('sonando');
}

function pararSonido() {
  clearInterval(timerCiclo); timerCiclo = null;
  activos.forEach(o => { try { o.stop(); } catch (e) {} });
  activos.clear();
  $('estado').classList.remove('sonando');
}

function terminar() {
  pararSonido();
  objetivo = null;
  clearInterval(vigilante);
  $('estado').textContent = 'Alarma finalizada.';
  $('detener').disabled = true; $('activar').disabled = false;
}

/* ---------- Programación ---------- */
function proximaOcurrencia(hhmmss) {
  const [h, m, s = 0] = hhmmss.split(':').map(Number);
  const d = new Date(); d.setHours(h, m, s, 0);
  if (d <= new Date()) d.setDate(d.getDate() + 1); // si ya pasó, mañana
  return d;
}

$('activar').onclick = () => {
  if (!$('hora').value) { $('estado').textContent = 'Introduce una hora.'; return; }
  const dur = Math.min(600, Math.max(1, parseInt($('duracion').value) || 30));
  $('duracion').value = dur;
  iniciarAudio(); // el clic desbloquea el audio del navegador
  objetivo = proximaOcurrencia($('hora').value);
  $('detener').disabled = false; $('activar').disabled = true;
  clearInterval(vigilante);
  vigilante = setInterval(() => {
    if (objetivo && Date.now() >= objetivo.getTime()) {
      objetivo = null; clearInterval(vigilante);
      $('estado').textContent = '🔔 ¡Suena la alarma!';
      sonar(dur);
    } else if (objetivo) {
      $('estado').textContent = 'Programada para ' + objetivo.toLocaleString('es-ES');
    }
  }, 250);
};

$('probar').onclick = () => { sonar(3); $('estado').textContent = 'Probando sonido…'; };

$('detener').onclick = () => {
  pararSonido(); objetivo = null; clearInterval(vigilante);
  $('estado').textContent = 'Alarma detenida.';
  $('detener').disabled = true; $('activar').disabled = false;
};

$('volumen').oninput = () => {
  if (ctx) master.gain.setValueAtTime(+$('volumen').value, ctx.currentTime);
};

/* ---------- Reloj ---------- */
setInterval(() => $('reloj').textContent = new Date().toLocaleTimeString('es-ES'), 250);
</script>
</body>
</html>
