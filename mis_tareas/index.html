<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Tareas</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --text:#e2e8f0;
    --muted:#94a3b8; --accent:#38bdf8; --danger:#f87171; --ok:#4ade80;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(circle at top,#1e293b,#0f172a 70%);
    min-height:100vh; display:flex; justify-content:center;
    align-items:flex-start; padding:40px 16px; color:var(--text);
  }
  .app{
    width:100%; max-width:520px; background:var(--card); border-radius:16px;
    padding:24px; box-shadow:0 20px 50px rgba(0,0,0,.45); border:1px solid #334155;
  }
  h1{font-size:1.5rem;margin-bottom:4px}
  .sub{color:var(--muted);font-size:.85rem;margin-bottom:20px}
  form{display:flex;gap:8px;margin-bottom:16px}
  input[type=text]{
    flex:1;padding:12px 14px;border-radius:10px;border:1px solid #334155;
    background:#0f172a;color:var(--text);font-size:1rem;outline:none;
  }
  input[type=text]:focus{border-color:var(--accent)}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-size:.9rem}
  .add{background:var(--accent);color:#0f172a;font-weight:600;padding:0 18px}
  .add:hover{filter:brightness(1.1)}
  .filters{display:flex;gap:6px;margin-bottom:14px}
  .filters button{background:transparent;color:var(--muted);padding:6px 12px;font-size:.8rem}
  .filters button.active{background:#334155;color:var(--text)}
  ul{list-style:none}
  li{
    display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;
    background:#0f172a;margin-bottom:8px;animation:in .18s ease;
  }
  @keyframes in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  li.done .txt{text-decoration:line-through;color:var(--muted)}
  .chk{width:20px;height:20px;accent-color:var(--ok);cursor:pointer;flex-shrink:0}
  .txt{flex:1;word-break:break-word}
  .del{background:transparent;color:var(--danger);font-size:1.1rem;padding:4px 8px}
  .empty{text-align:center;color:var(--muted);padding:28px 0;font-size:.9rem}
  .foot{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:14px;font-size:.8rem;color:var(--muted);
  }
  .clear{background:transparent;color:var(--muted);text-decoration:underline}
  .clear:hover{color:var(--danger)}
</style>
</head>
<body>
<div class="app">
  <h1>Mis tareas</h1>
  <p class="sub">Se guardan automáticamente en tu navegador</p>

  <form id="form">
    <input type="text" id="input" placeholder="¿Qué tienes que hacer?" autocomplete="off">
    <button class="add" type="submit">Añadir</button>
  </form>

  <div class="filters">
    <button data-f="all" class="active">Todas</button>
    <button data-f="pending">Pendientes</button>
    <button data-f="done">Completadas</button>
  </div>

  <ul id="list"></ul>

  <div class="foot">
    <span id="count"></span>
    <button class="clear" id="clear">Borrar completadas</button>
  </div>
</div>

<script>
  const $ = s => document.querySelector(s);
  const KEY = 'tareas.v1';
  let tasks = JSON.parse(localStorage.getItem(KEY) || '[]');
  let filter = 'all';

  const save = () => localStorage.setItem(KEY, JSON.stringify(tasks));

  function render(){
    const list = $('#list');
    const visible = tasks.filter(t =>
      filter === 'all' ? true : filter === 'done' ? t.done : !t.done
    );

    list.innerHTML = '';

    if (!visible.length){
      const p = document.createElement('li');
      p.className = 'empty';
      p.textContent = tasks.length ? 'Nada por aquí 👀' : 'Sin tareas. ¡Añade una arriba!';
      list.appendChild(p);
    }

    visible.forEach(t => {
      const li = document.createElement('li');
      if (t.done) li.classList.add('done');

      const chk = document.createElement('input');
      chk.type = 'checkbox';
      chk.className = 'chk';
      chk.checked = t.done;
      chk.addEventListener('change', () => {
        t.done = chk.checked;
        save(); render();
      });

      const span = document.createElement('span');
      span.className = 'txt';
      span.textContent = t.text;

      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '✕';
      del.title = 'Eliminar';
      del.addEventListener('click', () => {
        tasks = tasks.filter(x => x.id !== t.id);
        save(); render();
      });

      li.append(chk, span, del);
      list.appendChild(li);
    });

    const pending = tasks.filter(t => !t.done).length;
    $('#count').textContent = tasks.length
      ? `${pending} pendiente${pending === 1 ? '' : 's'} de ${tasks.length}`
      : '';
  }

  $('#form').addEventListener('submit', e => {
    e.preventDefault();
    const input = $('#input');
    const text = input.value.trim();
    if (!text) return;
    tasks.unshift({ id: Date.now() + Math.random(), text, done: false });
    input.value = '';
    save(); render();
  });

  document.querySelectorAll('.filters button').forEach(b => {
    b.addEventListener('click', () => {
      filter = b.dataset.f;
      document.querySelectorAll('.filters button')
        .forEach(x => x.classList.toggle('active', x === b));
      render();
    });
  });

  $('#clear').addEventListener('click', () => {
    tasks = tasks.filter(t => !t.done);
    save(); render();
  });

  render();
</script>
</body>
</html>
